# One-click deploy on Render: New → Blueprint → pick this repo/branch.
services:
  - type: web
    name: headline-desk
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TYPESAFE_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Comma-separated. Leave both empty to allow any verified Google account.
      - key: ALLOWED_DOMAINS
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
      - key: RATE_LIMIT_PER_HOUR
        value: "30"
