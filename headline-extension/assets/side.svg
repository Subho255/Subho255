<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 340" width="64" height="340">
  <!-- Edge strip: a kitten and a tumbler centred on x=32. The CSS puts this centre line on the
       popup's edge, so each one is half hidden and peeks in from the side. -->
  <defs>
    <g id="bow">
      <g stroke="#3a2a33" stroke-width="2.2" stroke-linejoin="round" fill="#ff5c93">
        <path d="M0 0 Q-20 -18 -22 -2 Q-24 14 0 4 Z"/>
        <path d="M0 0 Q20 -18 22 -2 Q24 14 0 4 Z"/>
        <circle cx="0" cy="2" r="5" fill="#ff8fb3"/>
      </g>
    </g>
    <g id="face">
      <path d="M-18 -4 L-19 -22 L-6 -14 Z M18 -4 L19 -22 L6 -14 Z" fill="#fff" stroke="#3a2a33" stroke-width="2" stroke-linejoin="round"/>
      <ellipse cx="0" cy="2" rx="22" ry="17" fill="#fff" stroke="#3a2a33" stroke-width="2"/>
      <ellipse cx="-8" cy="2" rx="2" ry="2.8" fill="#3a2a33"/>
      <ellipse cx="8" cy="2" rx="2" ry="2.8" fill="#3a2a33"/>
      <ellipse cx="0" cy="7" rx="2" ry="1.5" fill="#ff7fa8"/>
      <path d="M-3 10 Q-1.5 12 0 10.5 Q1.5 12 3 10" fill="none" stroke="#3a2a33" stroke-width="1.3" stroke-linecap="round"/>
      <ellipse cx="-14" cy="8" rx="3.5" ry="2" fill="#ffb3cc"/>
      <ellipse cx="14" cy="8" rx="3.5" ry="2" fill="#ffb3cc"/>
      <g transform="translate(14 -16) scale(0.45)"><use href="#bow"/></g>
    </g>
    <!-- Quencher-style tumbler, unbranded. Drawn around its own centre. -->
    <g id="tumbler">
      <g transform="translate(-24 -30)">
        <path d="M27 -2 L36 -34" stroke="#3a2a33" stroke-width="7.5" stroke-linecap="round"/>
        <path d="M27 -2 L36 -34" stroke="var(--c)" stroke-width="5" stroke-linecap="round"/>
        <path d="M42 14 Q58 14 58 30 Q58 46 40 46" fill="none" stroke="#3a2a33" stroke-width="7.5"/>
        <path d="M42 14 Q58 14 58 30 Q58 46 40 46" fill="none" stroke="var(--c)" stroke-width="3.5"/>
        <path d="M6 6 H42 L37 66 Q36 70 32 70 H16 Q12 70 11 66 Z" fill="var(--c)" stroke="#3a2a33" stroke-width="2.2" stroke-linejoin="round"/>
        <rect x="4" y="-4" width="40" height="10" rx="4" fill="#fff" stroke="#3a2a33" stroke-width="2.2"/>
        <rect x="9" y="24" width="30" height="7" rx="2" fill="#fff" opacity="0.7"/>
        <path d="M15 12 V58" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
      </g>
    </g>
  </defs>
  <g transform="translate(32 80) rotate(-16) scale(1.35)"><use href="#face"/></g>
  <g transform="translate(32 240) rotate(14) scale(0.95)" style="--c:#ffaecb"><use href="#tumbler"/></g>
</svg>
