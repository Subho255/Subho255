<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 420" width="64" height="420">
  <!-- Edge strip: kittens and tumblers centred on x=32. The CSS puts this centre line on the
       popup's edge, so each one is half hidden and peeks in from the side. -->
  <defs>
    <g id="face">
      <path d="M-18 -4 L-19 -22 L-6 -14 Z M18 -4 L19 -22 L6 -14 Z" fill="#fff" stroke="#7d2245" stroke-width="2.2" stroke-linejoin="round"/>
      <ellipse cx="0" cy="2" rx="22" ry="17" fill="#fff" stroke="#7d2245" stroke-width="2.2"/>
      <ellipse cx="-8" cy="2" rx="2" ry="2.8" fill="#3a1a28"/>
      <ellipse cx="8" cy="2" rx="2" ry="2.8" fill="#3a1a28"/>
      <ellipse cx="0" cy="7" rx="2" ry="1.5" fill="#ff7fa8"/>
      <path d="M-3 10 Q-1.5 12 0 10.5 Q1.5 12 3 10" fill="none" stroke="#7d2245" stroke-width="1.3" stroke-linecap="round"/>
      <ellipse cx="-14" cy="8" rx="3.5" ry="2" fill="#ffb3cc"/>
      <ellipse cx="14" cy="8" rx="3.5" ry="2" fill="#ffb3cc"/>
      <g transform="translate(14 -16) scale(0.45)" stroke="#7d2245" stroke-width="2.4" stroke-linejoin="round" fill="#ff5c86">
        <path d="M0 0 Q-20 -18 -22 -2 Q-24 14 0 4 Z"/>
        <path d="M0 0 Q20 -18 22 -2 Q24 14 0 4 Z"/>
        <circle cx="0" cy="2" r="5" fill="#ff8fab"/>
      </g>
    </g>
    <!-- Quencher-style tumbler, unbranded, drawn around its centre. -->
    <g id="tumbler">
      <g transform="translate(-26 -40)" stroke="#7d2245" stroke-linejoin="round" stroke-linecap="round">
        <path d="M30 -6 L32 -30" stroke-width="7"/>
        <path d="M30 -6 L32 -30" stroke="#f4eef1" stroke-width="3.4"/>
        <path d="M46 18 Q64 18 64 36 Q64 54 44 54" fill="none" stroke-width="7.5"/>
        <path d="M46 18 Q64 18 64 36 Q64 54 44 54" fill="none" stroke="var(--c)" stroke-width="3.4"/>
        <path d="M6 12 H46 L40 84 Q39 88 35 88 H17 Q13 88 12 84 Z" fill="var(--c)" stroke-width="2.6"/>
        <rect x="3" y="-4" width="46" height="12" rx="4" fill="#f4eef1" stroke-width="2.6"/>
        <rect x="5" y="7" width="42" height="6" fill="#c9b8c1" stroke-width="2"/>
        <path d="M16 20 V76" stroke="#fff" stroke-width="3.4" opacity="0.6"/>
      </g>
    </g>
  </defs>
  <g transform="translate(32 76) rotate(-14) scale(1.35)"><use href="#face"/></g>
  <g transform="translate(32 200) rotate(10)" style="--c:#fbe9dc"><use href="#tumbler"/></g>
  <g transform="translate(32 336) rotate(-8)" style="--c:#ff9dba"><use href="#tumbler"/></g>
</svg>
