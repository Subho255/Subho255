<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 170">
  <!-- Night empty state: a caped figure crouched on a rooftop ledge, silhouetted against a
       full moon, beside a gargoyle and a black tumbler. Original artwork. -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#f5c518" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f5c518" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="114" cy="78" r="74" fill="url(#glow)"/>
  <circle cx="114" cy="78" r="50" fill="#efe6c4"/>
  <circle cx="92" cy="60" r="7" fill="#ddd2a8"/><circle cx="138" cy="94" r="9" fill="#ddd2a8"/><circle cx="140" cy="56" r="4" fill="#ddd2a8"/><circle cx="96" cy="104" r="4" fill="#ddd2a8"/>
  <!-- ledge -->
  <path d="M0 140 H220 V170 H0 Z" fill="#07090d"/>
  <path d="M0 135 H220 V141 H0 Z" fill="#2b313c"/>
  <!-- gargoyle, rim-lit -->
  <g fill="#1d222c" stroke="#5d6470" stroke-width="1.4" stroke-linejoin="round">
    <path d="M14 135 V112 Q14 100 24 98 L26 90 L31 98 Q40 96 44 104 L54 100 Q52 110 44 112 Q46 124 42 135 Z"/>
    <path d="M26 104 Q18 96 10 100 Q16 104 18 110 Z"/>
  </g>
  <circle cx="36" cy="104" r="1.8" fill="#f5c518"/>
  <!-- caped figure crouching against the moon (silhouette, no logo, no ears) -->
  <g fill="#07090d">
    <circle cx="114" cy="76" r="11"/>
    <path d="M98 87 Q114 80 130 87 L148 135 Q139 128 134 137 Q129 128 122 136 Q115 127 108 136 Q101 128 95 137 Q90 128 80 135 Z"/>
  </g>
  <!-- black tumbler with a yellow straw -->
  <g stroke="#07090d" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" transform="translate(166 95)">
    <path d="M16 6 L22 -10" stroke-width="5"/>
    <path d="M16 6 L22 -10" stroke="#f5c518" stroke-width="2.6"/>
    <path d="M30 14 Q42 14 42 24 Q42 34 28 34" fill="none" stroke-width="5"/>
    <path d="M30 14 Q42 14 42 24 Q42 34 28 34" fill="none" stroke="#5d6470" stroke-width="2.2"/>
    <path d="M2 10 H32 L28 40 H6 Z" fill="#3a404c"/>
    <rect x="0" y="3" width="34" height="8" rx="3" fill="#9aa1ad"/>
  </g>
  <!-- bats crossing the moon -->
  <g fill="#07090d">
    <path transform="translate(92 42) scale(0.7)" d="M0 0 Q-3 -4 -6 -3 Q-10 -7 -16 -6 Q-13 -3 -14 1 Q-10 -1 -8 2 Q-5 0 -3 3 L0 5 L3 3 Q5 0 8 2 Q10 -1 14 1 Q13 -3 16 -6 Q10 -7 6 -3 Q3 -4 0 0 Z"/>
    <path transform="translate(142 70) scale(0.5) rotate(-12)" d="M0 0 Q-3 -4 -6 -3 Q-10 -7 -16 -6 Q-13 -3 -14 1 Q-10 -1 -8 2 Q-5 0 -3 3 L0 5 L3 3 Q5 0 8 2 Q10 -1 14 1 Q13 -3 16 -6 Q10 -7 6 -3 Q3 -4 0 0 Z"/>
  </g>
</svg>
