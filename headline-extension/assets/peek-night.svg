<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 104">
  <!-- Night: a gothic city skyline rising over the panel, a searchlight sweeping the sky,
       bats, and a caped figure on the tallest roof. Original artwork. -->
  <defs>
    <linearGradient id="beam" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0" stop-color="#f5c518" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f5c518" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- searchlight -->
  <path d="M226 62 L300 -6 L262 -6 Z" fill="url(#beam)"/>
  <!-- far buildings -->
  <g fill="#1a1f29">
    <rect x="8" y="58" width="26" height="46"/>
    <rect x="58" y="44" width="22" height="60"/>
    <path d="M112 40 h24 v64 h-24 z M112 40 l12 -14 l12 14 z"/>
    <rect x="186" y="52" width="30" height="52"/>
    <rect x="262" y="60" width="30" height="44"/>
  </g>
  <!-- near buildings -->
  <g fill="#07090d">
    <path d="M0 104 V70 h20 v-8 h6 v8 h18 V104 Z"/>
    <!-- gargoyle on a ledge -->
    <path d="M30 70 h22 v34 h-22 z"/>
    <path d="M44 70 q4 -10 12 -8 q6 1 8 6 l-4 1 q-2 -3 -5 -2 l2 4 q-5 1 -8 -1 z"/>
    <path d="M70 104 V52 h10 v-10 h4 v10 h14 V104 Z"/>
    <!-- tall gothic tower with spire -->
    <path d="M140 104 V30 l-4 -2 l14 -24 l14 24 l-4 2 V104 Z"/>
    <path d="M128 104 V58 h12 v46 Z M160 104 V58 h12 v46 Z"/>
    <path d="M178 104 V64 l10 -8 l10 8 V104 Z"/>
    <path d="M204 104 V60 h26 v44 Z"/>
    <path d="M236 104 V72 h22 v-6 h4 v6 h14 V104 Z"/>
    <path d="M276 104 V80 h24 v24 Z"/>
  </g>
  <!-- caped figure on a rooftop (no logo, no ears) -->
  <g fill="#07090d" transform="translate(208 40)">
    <circle cx="8" cy="5" r="4.2"/>
    <path d="M3.5 8 Q8 6.5 12.5 8 L15 22 Q13 20 11.5 23 Q10 21 8 24 Q6 21 4.5 23 Q3 20 1 22 Z"/>
  </g>
  <!-- lit windows -->
  <g fill="#f5c518">
    <rect x="6" y="78" width="3" height="4" opacity="0.8"/><rect x="14" y="88" width="3" height="4" opacity="0.6"/>
    <rect x="76" y="60" width="3" height="4" opacity="0.9"/><rect x="88" y="72" width="3" height="4" opacity="0.6"/>
    <rect x="84" y="88" width="3" height="4" opacity="0.8"/>
    <rect x="146" y="40" width="3" height="5" opacity="0.9"/><rect x="152" y="54" width="3" height="5" opacity="0.7"/>
    <rect x="146" y="70" width="3" height="5" opacity="0.6"/><rect x="152" y="86" width="3" height="5" opacity="0.85"/>
    <rect x="184" y="76" width="3" height="4" opacity="0.7"/><rect x="210" y="70" width="3" height="4" opacity="0.8"/>
    <rect x="222" y="84" width="3" height="4" opacity="0.6"/><rect x="244" y="82" width="3" height="4" opacity="0.8"/>
    <rect x="282" y="90" width="3" height="4" opacity="0.7"/>
  </g>
  <!-- bats -->
  <g fill="#f5c518" opacity="0.85">
    <path transform="translate(272 18) scale(0.55)" d="M0 0 Q-3 -4 -6 -3 Q-10 -7 -16 -6 Q-13 -3 -14 1 Q-10 -1 -8 2 Q-5 0 -3 3 L0 5 L3 3 Q5 0 8 2 Q10 -1 14 1 Q13 -3 16 -6 Q10 -7 6 -3 Q3 -4 0 0 Z"/>
    <path transform="translate(250 30) scale(0.4) rotate(-10)" d="M0 0 Q-3 -4 -6 -3 Q-10 -7 -16 -6 Q-13 -3 -14 1 Q-10 -1 -8 2 Q-5 0 -3 3 L0 5 L3 3 Q5 0 8 2 Q10 -1 14 1 Q13 -3 16 -6 Q10 -7 6 -3 Q3 -4 0 0 Z"/>
  </g>
  <g fill="#3a404c">
    <path transform="translate(40 26) scale(0.5)" d="M0 0 Q-3 -4 -6 -3 Q-10 -7 -16 -6 Q-13 -3 -14 1 Q-10 -1 -8 2 Q-5 0 -3 3 L0 5 L3 3 Q5 0 8 2 Q10 -1 14 1 Q13 -3 16 -6 Q10 -7 6 -3 Q3 -4 0 0 Z"/>
    <path transform="translate(96 14) scale(0.38) rotate(12)" d="M0 0 Q-3 -4 -6 -3 Q-10 -7 -16 -6 Q-13 -3 -14 1 Q-10 -1 -8 2 Q-5 0 -3 3 L0 5 L3 3 Q5 0 8 2 Q10 -1 14 1 Q13 -3 16 -6 Q10 -7 6 -3 Q3 -4 0 0 Z"/>
  </g>
</svg>
