<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260">
  <defs>
    <!-- Quencher-style tumbler: lid, straw, tapered body, side handle. Unbranded. -->
    <g id="tumbler">
      <path d="M30 -14 L36 -34" stroke="#3a2a33" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M27 -2 L36 -34" stroke="var(--c, #ff8fb3)" stroke-width="5" stroke-linecap="round"/>
      <rect x="4" y="-4" width="40" height="10" rx="4" fill="#fff" stroke="#3a2a33" stroke-width="2.2"/>
      <path d="M6 6 H42 L37 66 Q36 70 32 70 H16 Q12 70 11 66 Z" fill="var(--c, #ff8fb3)" stroke="#3a2a33" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M42 14 Q58 14 58 30 Q58 46 40 46" fill="none" stroke="#3a2a33" stroke-width="2.2"/>
      <path d="M42 18 Q53 18 53 30 Q53 41 40 41" fill="none" stroke="var(--c, #ff8fb3)" stroke-width="3"/>
      <rect x="9" y="24" width="30" height="7" rx="2" fill="#fff" opacity="0.7"/>
      <path d="M15 12 V58" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    </g>
    <g id="bow">
      <g stroke="#3a2a33" stroke-width="2.2" stroke-linejoin="round" fill="#ff5c93">
        <path d="M0 0 Q-20 -18 -22 -2 Q-24 14 0 4 Z"/>
        <path d="M0 0 Q20 -18 22 -2 Q24 14 0 4 Z"/>
        <circle cx="0" cy="2" r="5" fill="#ff8fb3"/>
      </g>
    </g>
    <path id="heart" d="M0 4 C-8 -4 -14 2 -10 8 L0 18 L10 8 C14 2 8 -4 0 4 Z"/>
    <path id="sparkle" d="M0 -8 Q1.5 -1.5 8 0 Q1.5 1.5 0 8 Q-1.5 1.5 -8 0 Q-1.5 -1.5 0 -8 Z"/>
    <g id="face">
      <path d="M-18 -4 L-19 -22 L-6 -14 Z M18 -4 L19 -22 L6 -14 Z" fill="#fff" stroke="#3a2a33" stroke-width="2" stroke-linejoin="round"/>
      <ellipse cx="0" cy="2" rx="22" ry="17" fill="#fff" stroke="#3a2a33" stroke-width="2"/>
      <ellipse cx="-8" cy="2" rx="2" ry="2.8" fill="#3a2a33"/>
      <ellipse cx="8" cy="2" rx="2" ry="2.8" fill="#3a2a33"/>
      <ellipse cx="0" cy="7" rx="2" ry="1.5" fill="#ff7fa8"/>
      <ellipse cx="-14" cy="8" rx="3.5" ry="2" fill="#ffb3cc"/>
      <ellipse cx="14" cy="8" rx="3.5" ry="2" fill="#ffb3cc"/>
      <g transform="translate(-14 -16) scale(0.45)"><use href="#bow"/></g>
    </g>
  </defs>

  <g transform="translate(18 44) rotate(-8)" style="--c:#ffaecb"><use href="#tumbler"/></g>
  <g transform="translate(150 150) rotate(9)" style="--c:#d6c4ff"><use href="#tumbler"/></g>
  <g transform="translate(176 46)"><use href="#face"/></g>
  <g transform="translate(70 196)"><use href="#face"/></g>
  <g transform="translate(118 92) rotate(-14)"><use href="#bow"/></g>
  <g transform="translate(224 226) rotate(18) scale(0.7)"><use href="#bow"/></g>
  <g fill="#ff8fb3"><use href="#heart" transform="translate(228 108) rotate(12)"/></g>
  <g fill="#ffc2d6"><use href="#heart" transform="translate(30 150) rotate(-10) scale(0.8)"/></g>
  <g fill="#ffd36b">
    <use href="#sparkle" transform="translate(96 30)"/>
    <use href="#sparkle" transform="translate(240 170) scale(0.7)"/>
    <use href="#sparkle" transform="translate(126 238) scale(0.8)"/>
    <use href="#sparkle" transform="translate(16 236) scale(0.6)"/>
  </g>
</svg>
