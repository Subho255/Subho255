<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 420" width="64" height="420">
  <!-- Night edge strip: gothic towers with lit windows, black tumblers and bats, centred on
       x=32 so each is half hidden at the popup's edge. -->
  <defs>
    <path id="bat" d="M0 0 Q-3 -4 -6 -3 Q-10 -7 -16 -6 Q-13 -3 -14 1 Q-10 -1 -8 2 Q-5 0 -3 3 L0 5 L3 3 Q5 0 8 2 Q10 -1 14 1 Q13 -3 16 -6 Q10 -7 6 -3 Q3 -4 0 0 Z"/>
    <g id="tumbler">
      <g transform="translate(-26 -40)" stroke="#07090d" stroke-linejoin="round" stroke-linecap="round">
        <path d="M30 -6 L32 -30" stroke-width="7"/>
        <path d="M30 -6 L32 -30" stroke="var(--s)" stroke-width="3.4"/>
        <path d="M46 18 Q64 18 64 36 Q64 54 44 54" fill="none" stroke-width="7.5"/>
        <path d="M46 18 Q64 18 64 36 Q64 54 44 54" fill="none" stroke="var(--c)" stroke-width="3.4"/>
        <path d="M6 12 H46 L40 84 Q39 88 35 88 H17 Q13 88 12 84 Z" fill="var(--c)" stroke-width="2.6"/>
        <rect x="3" y="-4" width="46" height="12" rx="4" fill="#9aa1ad" stroke-width="2.6"/>
        <rect x="5" y="7" width="42" height="6" fill="#5d6470" stroke-width="2"/>
      </g>
    </g>
  </defs>
  <!-- gothic tower with lit windows -->
  <g transform="translate(32 18)">
    <path d="M-18 112 V24 l-3 -2 l21 -22 l21 22 l-3 2 V112 Z" fill="#11151c"/>
    <g fill="#f5c518">
      <rect x="-10" y="34" width="4" height="6" opacity="0.9"/><rect x="6" y="34" width="4" height="6" opacity="0.5"/>
      <rect x="-10" y="54" width="4" height="6" opacity="0.6"/><rect x="6" y="54" width="4" height="6" opacity="0.9"/>
      <rect x="-10" y="74" width="4" height="6" opacity="0.8"/><rect x="6" y="94" width="4" height="6" opacity="0.7"/>
    </g>
  </g>
  <g transform="translate(32 206) rotate(10)" style="--c:#2b313c;--s:#f5c518"><use href="#tumbler"/></g>
  <g transform="translate(32 342) rotate(-8)" style="--c:#1d2129;--s:#9aa1ad"><use href="#tumbler"/></g>
  <g fill="#3a404c">
    <use href="#bat" transform="translate(48 150) scale(0.9)"/>
    <use href="#bat" transform="translate(42 166) rotate(-14) scale(0.55)"/>
    <use href="#bat" transform="translate(46 280) rotate(-12) scale(0.7)"/>
    <use href="#bat" transform="translate(52 404) rotate(8) scale(0.6)"/>
  </g>
</svg>
